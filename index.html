<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titernik Accessories - Premium Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root {
--brand-color: #8e737d; /* Ձեր ուղարկած նկարի տեքստի գույնը */
--gold: #bfa37a;
--white: #ffffff;
--card-bg: #ffffff;
--text-color: #1a1a1a;
--border-color: #eeeeee;
--header-bg: rgba(255, 255, 255, 0.98);
--btn-bg: #1a1a1a;
--btn-text: #ffffff;
--body-bg: #f9f9f9
}

[data-theme="dark"] {
--body-bg: #1a1a1a;    
--white: #121212;
--card-bg: #1e1e1e;
--text-color: #e0e0e0;
--border-color: #333333;
--header-bg: rgba(18, 18, 18, 0.98);
--btn-bg: #ffffff; 
--btn-text: #000000;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
body { background: var(--body-bg); color: var(--text-color); scroll-behavior: smooth; }

header {
padding: 30px 20px;
text-align: center;
border-bottom: 1px solid var(--border-color);
position: sticky;
top: 0;
background: var(--header-bg);
z-index: 1000;
backdrop-filter: blur(10px);
}

/* Լոգոյի գլխավոր բլոկը */
.logo-container {
display: flex;
align-items: center;
justify-content: center;
gap: 20px;
margin-bottom: 25px;
}

/* Տեքստային լոգոն՝ ըստ ձեր նկարի ոճի */
.logo-text {
font-family: 'Playfair Display', serif;
font-size: 50px;
letter-spacing: 12px;
color: var(--brand-color);
text-transform: uppercase;
cursor: pointer;
user-select: none;
line-height: 1;
display: flex;
align-items: center;
transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.logo-text:hover { transform: scale(1.08); }
/* Թիթեռնիկի էֆեկտը (ըստ ցանկության) */
.logo-text::after {
content: '🦋';
font-size: 35px;
margin-left: 10px;
opacity: 0.8;
}

/* Ինստագրամի կլորացված լոգոն */
.instagram-brand-img {
width: 45px;
height: 45px;
border-radius: 50%;
object-fit: cover;
border: 1.5px solid var(--brand-color);
padding: 2px;
transition: 0.3s;
}

.instagram-brand-img:hover {
transform: scale(1.1) rotate(5deg);
}

.nav-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 1000px; margin: 0 auto; }
.search-bar { padding: 10px 15px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); border-radius: 25px; width: 180px; outline: none; }
.filter-btn { 
    padding: 10px 20px; 
    border: 1px solid var(--border-color); 
    background: var(--card-bg); 
    color: var(--text-color); 
    border-radius: 25px; 
    cursor: pointer; 
    font-size: 11px; 
    text-transform: uppercase; 
    font-weight: bold; 
}
.filter-btn:hover, .filter-btn.active { 
    border-color: var(--brand-color);
    color: var(--brand-color);
    transform: translateY(-2px);
}.theme-toggle {
    /* Պատճենում ենք wishlist-ի հիմնական ոճերը */
    background: var(--card-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    
    /* Փոխարենը տանք կոնկրետ չափսեր, օգտագործում ենք նույն padding-ը */
    padding: 10px; 
    /* Որպեսզի լինի կլոր, width-ն ու height-ը պետք է հավասար լինեն padding-ի հետ */
    width: 45px; 
    height: 45px;
    
    border-radius: 50%; /* Կլորացնում ենք */
    
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    
    /* Հեռացնում ենք այն քառակուսի պիքսելը */
    outline: none;
    -webkit-tap-highlight-color: transparent;
    
    transition: all 0.3s ease;
} 
@media (hover: hover) {
.theme-toggle:hover {
    background: var(--brand-color);
    border-color: var(--brand-color);
    transform: rotate(30deg) scale(1.1);
    box-shadow: 0 0 15px rgba(191, 163, 122, 0.4);
}



[data-theme="dark"] .theme-toggle:hover {
    background: #ffffff;
    color: #1a1a1a;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
} }
    .theme-toggle:active {
    background: var(--brand-color);
    transform: scale(0.95);
    transition: 0.1s;
}
.wishlist-count-btn { 
    background: var(--card-bg); 
    color: var(--text-color); 
    border: 1px solid var(--border-color); 
    border-radius: 25px; 
    padding: 10px 20px; 
    cursor: pointer; 
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease; /* Սահուն անցման համար */
}

/* Սրտիկի նախնական գույնը թող լինի նույնը, ինչ տեքստինը */
.wishlist-count-btn span.heart { 
    color: inherit; 
    transition: color 0.3s ease;
}

/* ՄԻԱՅՆ ՀԱՄԱԿԱՐԳԻՉՆԵՐԻ ՀԱՄԱՐ (Hover էֆեկտ) */
@media (hover: hover) {
    .wishlist-count-btn:hover {
        border-color: var(--brand-color);
        color: #ff4757;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 71, 87, 0.1);
    }

    /* Hover-ի ժամանակ նոր սրտիկը կդառնա կարմիր */
    .wishlist-count-btn:hover span.heart {
        color: #ff4757;
    }

    .back-btn:hover { 
        transform: scale(1.05); 
        background: #7a626b; 
    }
}

.back-btn {
    padding: 15px 30px;
    background: var(--brand-color);
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 30px;
    display: inline-block;
    transition: all 0.3s ease;
}

/* ՀԵՌԱԽՈՍԻ ՀԱՄԱՐ (Active վիճակ, երբ մատով սեղմում ես) */
.back-btn:active, .wishlist-count-btn:active {
    transform: scale(0.95);
    opacity: 0.8;
}
.container { padding: 40px 5%; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
/* Հեռացրել ենք border-bottom-ը կատեգորիաների վերնագրերից */
.category-title { margin: 40px 0 20px; border-bottom: none; display: inline-block; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; color: var(--brand-color); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-bottom: 50px; }
.card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px; transition: 0.4s ease; border-radius: 12px; position: relative; overflow: hidden; }
.card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

.img-container { width: 100%; height: 300px; overflow: hidden; border-radius: 10px; background: #fdfdfd; cursor: zoom-in; position: relative; }
.img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0; }
.img-container img.loaded { opacity: 1; }

.wish-icon { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.9); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; border: none; color: #ccc; z-index: 10; }
.wish-icon.active { color: #ff4757; }

.price { font-size: 19px; color: var(--brand-color); font-weight: bold; margin: 12px 0 5px; }
.id-tag { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 15px; display: block; }

.order-btn {
display: block;
width: 100%;
padding: 12px;
background: var(--btn-bg);
color: var(--btn-text) !important;
text-align: center;
text-decoration: none;
font-size: 12px;
font-weight: bold;
text-transform: uppercase;
border-radius: 6px;
}
.order-btn:hover { background: var(--brand-color); color: white !important; }

.overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:2000; }
.overlay img { max-width: 90%; max-height: 90%; border-radius: 10px; }

@media (max-width: 600px) {
.logo-text { font-size: 32px; letter-spacing: 6px; }
.logo-text::after { font-size: 20px; }
.grid { grid-template-columns: 1fr 1fr; gap: 12px; }
.img-container { height: 180px; }
.instagram-brand-img { width: 38px; height: 38px; }
}
</style>
</head>

const products = rawData.map((p, index) => ({
...p, id: p.cat.substring(0, 2).toUpperCase() + "-" + (100 + index)
}));

let wishlist = JSON.parse(localStorage.getItem('titernik_wishlist')) || [];

function toggleTheme() {
const body = document.documentElement;
const btn = document.getElementById('themeBtn');
if (body.getAttribute('data-theme') === 'dark') {
body.removeAttribute('data-theme');
btn.innerText = '🌙';
localStorage.setItem('theme', 'light');
} else {
body.setAttribute('data-theme', 'dark');
btn.innerText = '☀️';
localStorage.setItem('theme', 'dark');
}
}

if (localStorage.getItem('theme') === 'dark') {
document.documentElement.setAttribute('data-theme', 'dark');
document.getElementById('themeBtn').innerText = '☀️';
}

function renderProducts(data, isWishlist = false) {
const catalog = document.getElementById('catalog');
catalog.innerHTML = '';
if(isWishlist) {
        // Հանեցինք Flexbox-ը և կոճակն ու վերնագիրը դրեցինք առանձին տողերում
        catalog.innerHTML = `
            <button class="back-btn" onclick="renderProducts(products)" style="display: block;">← Հետ դեպի կատալոգ</button>
            <h2 class="category-title" style="display: block; border-bottom: none;">Իմ նախընտրածները</h2>
            <div class="grid" id="wishGrid" style="margin-top:30px;"></div>`;
        appendCards(data, document.getElementById('wishGrid'));
    } else {
        const categories = [...new Set(products.map(p => p.cat))];
        categories.forEach(cat => {
            const items = data.filter(p => p.cat === cat);
            if(items.length > 0) {
                const section = document.createElement('section');
                // Հեռացված է border-bottom գիծը վերնագրից
                section.innerHTML = `<h2 class="category-title" style="display:block; border-bottom: none;">${cat}</h2><div class="grid"></div>`;
                catalog.appendChild(section);
                appendCards(items, section.querySelector('.grid'));
            }
        });
    }
    updateWishCount();
}function appendCards(items, container) {
items.forEach(p => {
const isWished = wishlist.includes(p.id) ? 'active' : '';
container.innerHTML += `
<div class="card" id="card-${p.id}">
<button class="wish-icon ${isWished}" onclick="toggleWishlist('${p.id}')">❤</button>
<div class="img-container" onclick="openImage('${p.img}')">
<img src="${p.img}" alt="${p.cat}" onload="this.classList.add('loaded')">
</div>
<div class="price">${p.price} ֏</div>
<span class="id-tag">ID: ${p.id}</span>
<a href="https://ig.me/m/titernik_accessories" target="_blank" class="order-btn" onclick="copyToClipboard('${p.id}')">Պատվիրել</a>
</div>
`;
});
}

function toggleWishlist(id) {
if(wishlist.includes(id)) {
wishlist = wishlist.filter(item => item !== id);
const card = document.getElementById(`card-${id}`);
if(document.getElementById('wishGrid') && card) {
card.remove();
}
} else {
wishlist.push(id);
}
localStorage.setItem('titernik_wishlist', JSON.stringify(wishlist));
document.querySelectorAll(`#card-${id} .wish-icon`).forEach(icon => {
icon.classList.toggle('active');
});
updateWishCount();
}

function updateWishCount() {
document.getElementById('wishCount').innerText = wishlist.length;
}

function showWishlist() {
const filtered = products.filter(p => wishlist.includes(p.id));
renderProducts(filtered, true);
}

function filterCategory(category) {
const btns = document.querySelectorAll('.filter-btn');
btns.forEach(btn => btn.classList.remove('active'));
if(event && event.target.classList.contains('filter-btn')) event.target.classList.add('active');
if(category === 'all') renderProducts(products);
else renderProducts(products.filter(p => p.cat === category));
}

function searchProducts() {
    const searchInput = document.getElementById('searchInput');
    const catalog = document.getElementById('catalog'); // Քո կոդում ID-ն սա է
    
    if (!searchInput || !catalog) return;

    const term = searchInput.value.trim().toLowerCase();

    // 1. Եթե դատարկ է, ցուցադրում ենք բոլորը
    if (term === "") {
        renderProducts(products);
        return;
    }

    // 2. Զտում ենք ապրանքները
    const filteredProducts = products.filter(p => {
        const idStr = p.id ? String(p.id).toLowerCase() : "";
        const catStr = p.cat ? String(p.cat).toLowerCase() : "";
        return idStr.includes(term) || catStr.includes(term);
    });

    // 3. Ստուգում ենք արդյունքը
    if (filteredProducts.length === 0) {
        // Մաքրում ենք կատալոգը և գրում տեքստը
        catalog.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 100px 20px; width: 100%;">
                <div style="font-size: 50px; margin-bottom: 20px;">🔍</div>
                <h3 style="color: var(--text-color); font-family: 'Playfair Display', serif;">Արդյունք չի գտնվել</h3>
                <p style="color: var(--text-color); opacity: 0.6;">"${term}"-ին համապատասխան ոչինչ չկա:</p>
                <button onclick="document.getElementById('searchInput').value=''; renderProducts(products);" 
                        style="margin-top: 25px; padding: 10px 25px; border: 1px solid var(--border-color); background: var(--brand-color); color: white; border-radius: 30px; cursor: pointer;">
                    Տեսնել ամբողջը
                </button>
            </div>
        `;
    } else {
        // 4. Կանչում ենք քո ֆունկցիան՝ փոխանցելով միայն զտվածները
        renderProducts(filteredProducts);
    }
}
function openImage(src) {
document.getElementById('overlayImg').src = src;
document.getElementById('overlay').style.display = 'flex';
}

function copyToClipboard(id) {
navigator.clipboard.writeText("Բարև ձեզ, ցանկանում եմ պատվիրել այս ապրանքը: Կոդ: " + id);
alert("Պատվերի կոդը պատճենվեց:");
}
